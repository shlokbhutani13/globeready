name: Refresh zero-cost live news

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zero-cost-live-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - name: Collect official-source excerpts
        working-directory: server
        run: npm run news:live
      - name: Verify collector and artifact contracts
        working-directory: server
        env:
          NODE_OPTIONS: --no-experimental-webstorage
        run: npm test -- --run tests/auto-news-ingestion.test.js tests/auto-news-collector.test.js
      - name: Commit a changed feed
        run: |
          if git diff --quiet -- client/public/data/live-news.json server/data/live-news-run.json; then
            echo "Official-source feed is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/data/live-news.json server/data/live-news-run.json
          git commit -m "chore(news): refresh official-source feed"
          git push origin "HEAD:${GITHUB_REF_NAME}"
