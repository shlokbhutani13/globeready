name: Send push reminders

# Off until the owner sets the repository variable PUSH_REMINDERS_ENABLED to "true" after granting the service account
# the two roles listed in docs/OWNER_RUNBOOK.md. Runs once a day (about 9 a.m. US Eastern).
on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-cost-push-reminders
  cancel-in-progress: false

jobs:
  send:
    if: vars.PUSH_REMINDERS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - working-directory: server
        run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Send today's reminders
        working-directory: server
        env:
          FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: node scripts/send-push-reminders.mjs
