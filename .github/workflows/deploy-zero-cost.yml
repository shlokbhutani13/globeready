name: Deploy zero-cost public beta

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy a temporary preview first; live requires the protected environment.
        required: true
        default: preview
        type: choice
        options: [preview, live]

permissions:
  contents: read

concurrency:
  group: zero-cost-hosting-${{ inputs.target }}
  cancel-in-progress: false

env:
  VITE_ZERO_COST_PUBLIC: "true"
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
  VITE_PRIVACY_CONTACT: ${{ vars.VITE_PRIVACY_CONTACT }}
  VITE_FCM_VAPID_KEY: ${{ vars.VITE_FCM_VAPID_KEY }}
  VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Refuse incomplete public configuration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID FIREBASE_SERVICE_ACCOUNT; do
            test -n "$(printenv "$name")" || { echo "Missing required configuration: $name"; exit 1; }
          done
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npm test
      - working-directory: client
        run: npm run build -- --mode zero-cost-public
      - uses: actions/upload-artifact@v6
        with:
          name: zero-cost-public-${{ github.run_id }}
          path: client/dist
          if-no-files-found: error
          retention-days: 7

  preview:
    if: inputs.target == 'preview'
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: zero-cost-public-${{ github.run_id }}
          path: client/dist
      - name: Use the zero-cost Firebase configuration with preview no-index headers
        run: |
          cp firebase.zero-cost.json firebase.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("firebase.json", "utf8"));
          config.hosting.headers.unshift({
            source: "**",
            headers: [{ key: "X-Robots-Tag", value: "noindex, nofollow, noarchive" }],
          });
          writeFileSync("firebase.json", `${JSON.stringify(config, null, 2)}\n`);
          NODE
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          channelId: preview-${{ github.run_number }}
          expires: 7d

  live:
    if: inputs.target == 'live'
    needs: verify
    environment: globeready-live
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: google-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Deploy zero-cost Firestore rules
        env:
          FIREBASE_RULES_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: node server/scripts/deploy-firestore-rules.mjs
      - uses: actions/download-artifact@v7
        with:
          name: zero-cost-public-${{ github.run_id }}
          path: client/dist
      - name: Use the zero-cost Firebase configuration (CSP, cache headers, and zero-cost rules)
        run: cp firebase.zero-cost.json firebase.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
